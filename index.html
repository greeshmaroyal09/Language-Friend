<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="theme-color" content="#17101e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Language Friend" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Friend</title>
  </head>
  <body>
    <div id="root"><p id="startup-status" role="status">Loading Language Friend…</p></div>
    <script>
      // Recover from an old HTML document whose hashed entry was replaced during a deployment.
      window.addEventListener("error", (event) => {
        const script = event.target;
        if (!(script instanceof HTMLScriptElement) || script.type !== "module") return;
        if (!document.getElementById("startup-status")) return;
        const key = "language-friend.boot-retry:" + script.src;
        try {
          if (navigator.onLine && !sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, "1");
            location.reload();
            return;
          }
        } catch { /* A browser that blocks session storage still gets the recovery message. */ }
        document.getElementById("startup-status").textContent = navigator.onLine
          ? "Language Friend couldn’t load. Refresh to try again."
          : "You’re offline. Reconnect and refresh to open Language Friend.";
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
